name: ci
on:
  workflow_dispatch:
  push:
      branches-ignore:
        - 'release/**'
jobs:
  bump-and-publish:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install & Build
#        npm run test
        run: |
          npm ci
          npm run lint
          npm run build
